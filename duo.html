<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <script>
    if (sessionStorage.getItem("puzzle1_solved") !== "true") {
      window.location.replace("index.html");
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      background: linear-gradient(135deg, #1a5fb4 0%, #2a7fd4 50%, #1a5fb4 100%);
      color: #1b1b1b;
      font-family: "Segoe UI", "Courier Prime", Tahoma, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* fałszywe okno w stylu Windows 10 */
    .window {
      width: min(92vw, 560px);
      background: #f3f3f3;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      overflow: hidden;
      animation: fadeIn 0.6s ease both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .titlebar {
      background: #ffffff;
      border-bottom: 1px solid #e1e1e1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 0 14px;
      height: 32px;
      font-size: 12px;
      color: #333;
      user-select: none;
    }
    .titlebar .app-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .titlebar .app-title::before {
      content: "";
      width: 14px;
      height: 14px;
      background: #0078d7;
      border-radius: 2px;
      display: inline-block;
    }
    .win-controls {
      display: flex;
      height: 100%;
    }
    .win-controls span {
      width: 46px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI Symbol", sans-serif;
      font-size: 10px;
      color: #333;
      cursor: default;
    }
    .win-controls span:hover {
      background: #e5e5e5;
    }
    .win-controls span.close:hover {
      background: #e81123;
      color: #fff;
    }

    .content {
      padding: 40px 36px 44px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      background: #fbfbfb;
    }

    .equation-row {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: 'Courier Prime', monospace;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 700;
      color: #1b1b1b;
      white-space: nowrap;
    }

    input[type="text"] {
      background: #ffffff;
      border: 1px solid #b0b0b0;
      border-radius: 2px;
      outline: none;
      color: #1b1b1b;
      font-family: 'Courier Prime', monospace;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      font-weight: 400;
      letter-spacing: 0.15em;
      text-align: center;
      width: clamp(80px, 12vw, 120px);
      padding: 10px 14px;
      caret-color: #0078d7;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: #0078d7;
      box-shadow: 0 0 0 1px #0078d7;
    }
    input[type="text"]::placeholder {
      color: #b5b5b5;
      letter-spacing: 0.1em;
    }

    .statusbar {
      border-top: 1px solid #e1e1e1;
      padding: 8px 16px;
      font-size: 11px;
      color: #767676;
      background: #f3f3f3;
    }

    .window.glitch {
      animation: glitch-content 0.1s steps(1) forwards;
    }
    @keyframes glitch-content {
      0%   { transform: translate(-8px, 2px);  filter: invert(1) brightness(3); }
      33%  { transform: translate(6px, -4px);  filter: hue-rotate(180deg); }
      66%  { transform: translate(-4px, 6px);  filter: invert(1); }
      100% { transform: translate(0, 0);       filter: none; }
    }
  </style>
</head>
<body>
  <div class="window" id="center">
    <div class="titlebar">
      <div class="app-title">Calculator</div>
      <div class="win-controls">
        <span>&#8211;</span>
        <span>&#9633;</span>
        <span class="close">&#10005;</span>
      </div>
    </div>
    <div class="content">
      <div class="equation-row">
        <span>73 / 65 = 37</span>
      </div>
      <div class="equation-row">
        <span>95 / 16 =</span>
        <input type="text" id="answer" placeholder="..." autocomplete="off" spellcheck="false" />
      </div>
    </div>
    <div class="statusbar">Standard</div>
  </div>
  <script>
    const input  = document.getElementById("answer");
    const center = document.getElementById("center");
    const _h2 = "Hxs="; /* for person messing around with the code, its currently may 9 2026 1:40 am, my head hurt and I think I need some sleep */
    const _k  = 42;
    function _d(s) {
      return atob(s).split("").map(c => String.fromCharCode(c.charCodeAt(0) ^ _k)).join("");
    }
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        if (input.value === _d(_h2)) {
          sessionStorage.setItem("puzzle2_solved", "true");
          center.classList.add("glitch");
        setTimeout(() => {
        window.location.href = "tres.html";
        }, 100);
        }
        return;
      }
      if (
        !/^[0-9]$/.test(e.key) &&
        !["Backspace","Delete","ArrowLeft","ArrowRight","Tab"].includes(e.key)
      ) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
